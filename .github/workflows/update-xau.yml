name: Update XAUUSD and EURUSD Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download market data
        shell: bash
        run: |
          set -e
          BASE="https://xauusd.forex-rezaei.workers.dev/xau"
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          FORCE_ALL="${{ github.event_name == 'workflow_dispatch' }}"

          fetch_tf () {
            symbol="$1"
            tf="$2"
            file="$3"
            limit="$4"
            curl -fsSL "$BASE?symbol=$symbol&tf=$tf&limit=$limit" -o "$file"
          }

          fetch_tf "XAU/USD" "5min" "xauusd-m5.json" "500"
          fetch_tf "EUR/USD" "5min" "eurusd-m5.json" "500"

          if [ "$FORCE_ALL" = "true" ]; then
            for spec in "15min m15" "30min m30" "1h h1" "1day d1" "1week w1" "1month mn1"; do
              set -- $spec
              fetch_tf "XAU/USD" "$1" "xauusd-$2.json" "500"
              fetch_tf "EUR/USD" "$1" "eurusd-$2.json" "500"
            done
          else
            if [ $((10#$MINUTE % 15)) -eq 0 ]; then
              fetch_tf "XAU/USD" "15min" "xauusd-m15.json" "500"
              fetch_tf "EUR/USD" "15min" "eurusd-m15.json" "500"
            fi
            if [ $((10#$MINUTE % 30)) -eq 0 ]; then
              fetch_tf "XAU/USD" "30min" "xauusd-m30.json" "500"
              fetch_tf "EUR/USD" "30min" "eurusd-m30.json" "500"
            fi
            if [ "$MINUTE" = "00" ]; then
              fetch_tf "XAU/USD" "1h" "xauusd-h1.json" "500"
              fetch_tf "EUR/USD" "1h" "eurusd-h1.json" "500"
            fi
            if [ "$MINUTE" = "00" ] && [ $((10#$HOUR % 6)) -eq 0 ]; then
              for spec in "1day d1" "1week w1" "1month mn1"; do
                set -- $spec
                fetch_tf "XAU/USD" "$1" "xauusd-$2.json" "500"
                fetch_tf "EUR/USD" "$1" "eurusd-$2.json" "500"
              done
            fi
          fi

      - name: Commit data
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add xauusd-*.json eurusd-*.json
          git diff --cached --quiet || git commit -m "Update XAUUSD and EURUSD multi-timeframe data"
          git push
