name: Update XAUUSD Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download XAUUSD data
        run: |
          curl -L "https://xauusd.forex-rezaei.workers.dev/xau?tf=5min&limit=500" -o xauusd-m5.json

      - name: Commit data
        run: |
          git config user.name "xauusd-bot"
          git config user.email "xauusd-bot@users.noreply.github.com"
          git add xauusd-m5.json
          git diff --cached --quiet || git commit -m "Update XAUUSD M5"
          git push
